name: Monorepo verify

# Reproduces the creator's reported toolchain (Ubuntu / Node 24 / npm 11) against
# all three applications, so a PR cannot be declared green on a developer machine
# alone. Deliberately uses `npm ci`, never `npm install`: `npm install` silently
# repairs a lockfile that is out of sync with package.json, which is exactly how
# the missing @emnapi entries behind PR #14 could have reached CI undetected.

on:
  pull_request:
    branches:
      - main
      - 'migration/**'
  push:
    branches:
      - 'migration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report all three apps on every run; a backend failure must not hide a
      # frontend or dashboard failure.
      fail-fast: false
      matrix:
        include:
          - app: backend
            test: npm --prefix backend run test:security
            build: npm --prefix backend run build
          - app: frontend
            build: npm --prefix frontend run build -- --webpack
          - app: dashboard
            build: npm --prefix dashboard run build

    steps:
      - name: Check out the merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Pin npm 11
        run: npm install --global npm@^11.0.0

      - name: Record and enforce toolchain
        run: |
          node --version
          npm --version
          major="$(npm --version | cut -d. -f1)"
          if [ "$major" != "11" ]; then
            echo "::error::Expected npm 11, got $(npm --version)"
            exit 1
          fi

      # `--ignore-scripts` is a supply-chain control, not a workaround: all three
      # apps were confirmed to install, test and build without running a single
      # lifecycle script, which also makes npm 11's install-script approval
      # prompt (esbuild) a non-event in CI.
      - name: Install ${{ matrix.app }} (npm ci - fails on lockfile drift)
        run: npm --prefix ${{ matrix.app }} ci --ignore-scripts --no-audit --no-fund

      - name: Test ${{ matrix.app }}
        if: matrix.test != ''
        run: ${{ matrix.test }}

      - name: Build ${{ matrix.app }}
        run: ${{ matrix.build }}

      - name: Confirm the working tree is still clean
        shell: bash
        run: |
          # A build that rewrites a tracked file (for example frontend/next-env.d.ts)
          # means the committed state and the built state disagree.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Build modified tracked files:"
            git status --porcelain
            git diff --stat
          else
            echo "Working tree clean after build."
          fi
